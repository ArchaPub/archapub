hero:
  background_image: "/img/archa-sala.jpg"
  tag: "Prešov centrum"
  title: "Miesto, kde sa stretáva celé mesto."
  subtitle: "Čapované pivo pod historickou kamennou klenbou priamo na Hlavnej. Otvorené každý deň do rána."
highlights:
  - "Otvorené do rána"
  - "Pod historickou klenbou"
  - "Čapovaný Pilsner a Šariš"
  - "Šípky a stolný futbal"
  - "Hlavná 23, Prešov"
story:
  title: "Stará archa, nová krv."
  text: "Prešov mal dosť podnikov, ktoré zatvárali skôr, ako sa večer poriadne začal. Archa je iná: otvorené do rána, bez kompromisov. Zíďte pod klenbu na pivo, partiu šípok alebo stolný futbal a zostaňte, ako dlho chcete."
  image: "/img/archa-bar-krb.jpg"
location_image: "/img/archa-vstup.jpg"
games:
  title: "Šípky a stolný futbal"
  text: "Vzadu za barom máme herňu so šípkami a stolným futbalom. Zober partiu, objednaj rundu a vyzvi kamošov – kto prehrá, platí ďalšiu."
  image: "/img/archa-herna.jpg"
en:
  title: "Where the whole town meets."
  subtitle: "Honest beer and an atmosphere you won't find anywhere else, right in the centre of Prešov."
  highlights:
    - "Open until late"
    - "Under a historic stone vault"
    - "Pilsner and Šariš on tap"
    - "Darts and table football"
    - "Hlavná 23, Prešov"
  story_title: "An old ark with new blood."
  games_title: "Darts and table football"
  games_text: "Behind the bar there is a games room with darts and table football. Bring your crew, order a round and challenge your friends – the loser buys the next one."
  story_text: "Prešov had enough places that closed before the night really started. Archa is different: open until the early hours, no compromises. Come down under the vault for a pint, a game of darts or table football, and stay as long as you like."
