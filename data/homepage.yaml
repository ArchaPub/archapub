story:
  title: "Stará archa, nová krv."
  text: "Prešov mal dosť podnikov, ktoré zatvárali skôr, ako večer poriadne začal. Archa je iná — otvorení do rána, bez kompromisov. Konečne normálny podnik v tomto meste."
