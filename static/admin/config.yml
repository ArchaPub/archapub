publish_mode: editorial_workflow
media_folder: static/img
public_folder: /img
site_url: "https://archapub.sk"
locale: "sk"
backend:
  name: github
  repo: ArchaPub/archapub
  branch: main
  # Ensure your base_url is correct for your auth setup
  base_url: https://decap.archapub.sk 

collections:
  # --- EVENTS COLLECTION ---
  - name: "events"
    label: "Program & Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date & Time", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["party", "koncert", "kvíz", "šport"], default: "party"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown"}

  # --- BLOG COLLECTION ---
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown"}

  # --- DATA FILES ---
  - name: "data"
    label: "Site Data"
    delete: false
    files:
      - name: "settings"
        label: "⚙️ Site Settings"
        file: "data/settings.yaml"
        fields:
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "SEO Description", name: "description", widget: "text"}
          - {label: "SEO Keywords", name: "keywords", widget: "string"}

      - name: "homepage"
        label: "🏠 Homepage Content"
        file: "data/homepage.yaml"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Background Image", name: "background_image", widget: "image"}
              - {label: "Tag (e.g. Prešov centrum)", name: "tag", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Story Section"
            name: "story"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}

      - name: "food"
        label: "🍔 Food Menu"
        file: "data/food.yaml"
        fields:
          - label: "Food Items"
            name: "items" # This MATCHES the key in the YAML file now
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "text", required: false}
              - {label: "Weight", name: "weight", widget: "string", required: false}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Burgre", "K pivu", "Špeciality"], allow_add: true}
              - {label: "Allergens", name: "allergens", widget: "string", required: false, hint: "e.g. 1, 3, 7"}

      - name: "drinks"
        label: "🍺 Drinks Menu"
        file: "data/drinks.yaml"
        fields:
          - label: "Drink Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Volume", name: "volume", widget: "string", required: false}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Pivo", "Nealko", "Víno"], allow_add: true}

      - name: "hours"
        label: "🕒 Opening Hours"
        file: "data/hours.yaml"
        fields:
          - label: "Schedule"
            name: "items"
            widget: "list"
            fields:
              - {label: "Day(s)", name: "day", widget: "string"}
              - {label: "Time", name: "time", widget: "string"}
              - {label: "Highlight", name: "highlight", widget: "boolean", default: false}

      - name: "notices"
        label: "📢 Notices (Header)"
        file: "data/notices.yaml"
        fields:
          - label: "Notices List"
            name: "items"
            widget: "list"
            fields:
              - {label: "Message", name: "text", widget: "string"}
              - {label: "Urgent", name: "urgent", widget: "boolean", default: false}

      - name: "socials"
        label: "🔗 Social Links"
        file: "data/socials.yaml"
        fields:
          - label: "Links"
            name: "items"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

      - name: "allergens"
        label: "⚠️ Allergens List"
        file: "data/allergens.yaml"
        fields:
          - label: "Allergens"
            name: "items"
            widget: "list"
            fields:
              - {label: "Number", name: "id", widget: "number"}
              - {label: "Name", name: "name", widget: "string"}

      - name: "bestsellers_food"
        label: "🌟 Bestsellers Food"
        file: "data/bestsellers_food.yaml"
        fields:
          - {label: "Cover Image", name: "image", widget: "image"}
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "text", required: false}
              - {label: "Weight", name: "weight", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Allergens", name: "allergens", widget: "string", required: false}

      - name: "bestsellers_drinks"
        label: "🌟 Bestsellers Drinks"
        file: "data/bestsellers_drinks.yaml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Volume", name: "volume", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
