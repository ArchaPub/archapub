{{ define "main" }}
<div class="wrapper py-10 lg:py-20">

  <header class="flex justify-between items-center mb-8">
    <a href="/" class="btn btn-dark group no-underline backdrop-blur-md border-white/10 hover:border-archa-gold" aria-label="Späť na úvod">
      <i class="ph ph-arrow-left group-hover:-translate-x-1 transition-transform" aria-hidden="true"></i>
      Späť na úvod
    </a>
  </header>
  
  <article class="card bg-archa-dark border-white/10 p-0 overflow-hidden max-w-4xl mx-auto shadow-2xl">

    {{ if .Params.image }}
    <div class="w-full aspect-video md:aspect-[21/9] overflow-hidden border-b border-white/10 relative group">
      <img
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
        src="{{ .Params.image }}" 
        alt="{{ .Title }}">
       <div class="absolute inset-0 bg-gradient-to-t from-archa-dark/60 via-transparent to-transparent"></div>
    </div>
    {{ end }}

    <div class="p-6 md:p-12 lg:p-16 relative">
        
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-head text-white uppercase leading-[0.9] tracking-tight mb-6 drop-shadow-lg">
          {{ .Title }}
        </h1>

        <div class="flex flex-wrap items-center gap-3 mb-8">
            {{ with .Params.type }}
            <span class="tag bg-archa-gold text-black border-none mb-0 font-bold shadow-lg">
                {{ . }}
            </span>
            {{ end }}
            
            <time datetime="{{ .Date.Format "2006-01-02" }}" class="tag bg-white/5 border border-white/20 text-white mb-0 hover:bg-white/10 transition-colors">
                <i class="ph ph-calendar-blank mr-2 opacity-70"></i>{{ .Date.Format "02. 01. 2006" }}
            </time>
        </div>

        {{ with .Params.author }}
        <div class="flex items-center gap-3 text-gray-400 text-sm border-y border-white/10 py-5 mb-10">
            <div class="w-10 h-10 rounded-full bg-archa-gold/10 flex items-center justify-center text-archa-gold shrink-0 border border-archa-gold/20">
                <i class="ph ph-user text-xl"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xs uppercase tracking-wider opacity-60 font-bold">Autor článku</span>
                <span class="text-white font-bold text-base leading-none mt-0.5">{{ . }}</span>
            </div>
        </div>
        {{ end }}

        <div class="prose prose-lg prose-invert max-w-none 
            font-body
            prose-headings:font-head prose-headings:uppercase prose-headings:tracking-wide prose-headings:text-white
            prose-p:text-gray-300 prose-p:leading-relaxed
            prose-a:text-archa-gold prose-a:font-bold prose-a:no-underline hover:prose-a:text-white hover:prose-a:border-b hover:prose-a:border-archa-gold transition-all
            prose-strong:text-white prose-strong:font-black
            prose-blockquote:border-l-4 prose-blockquote:border-archa-gold prose-blockquote:bg-white/5 prose-blockquote:px-6 prose-blockquote:py-4 prose-blockquote:rounded-r-lg prose-blockquote:not-italic
            prose-li:marker:text-archa-gold
            prose-img:rounded-xl prose-img:border prose-img:border-white/10 prose-img:shadow-xl">
          {{ .Content }}
        </div>
    </div>

    <footer class="p-6 md:p-12 border-t border-white/10 bg-black/20 flex flex-col sm:flex-row justify-between items-center gap-6">
      <div class="text-6xl text-white/5 font-black select-none tracking-[0.5em] font-head">
        ///
      </div>
      
      <a href="/" class="text-sm font-bold uppercase tracking-widest text-archa-gold hover:text-white transition-colors flex items-center gap-2">
         Všetky články <i class="ph ph-arrow-right"></i>
      </a>
    </footer>

  </article>
</div>
{{ end }}
