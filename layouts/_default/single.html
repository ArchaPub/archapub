{{ define "main" }}
<div class="wrapper py-12 lg:py-20 px-4">
  
  <article class="card bg-archa-dark border-2 border-white/10 shadow-lg overflow-hidden p-0">

    <header class="p-8 lg:p-12 border-b border-white/10 relative">
      <div class="flex flex-col gap-6">
        
        <div class="flex flex-wrap gap-3 text-sm font-bold uppercase tracking-widest font-body">
          <time datetime="{{ .Date.Format "2006-01-02" }}"
            class="bg-archa-gold text-archa-dark px-3 py-1 rounded-sm">
            {{ .Date.Format "02. 01. 2006" }}
          </time>
          
          {{ with .Params.author }}
          <span class="border border-archa-gold text-archa-gold px-3 py-1 rounded-sm">
            {{ . }}
          </span>
          {{ end }}

          {{ with .Params.type }}
          <span class="border border-white/30 text-white/70 px-3 py-1 rounded-sm">
            {{ . }}
          </span>
          {{ end }}
        </div>

        <h1 class="text-4xl md:text-5xl lg:text-6xl font-head text-white leading-[1.1] max-w-3xl">
          {{ .Title }}
        </h1>
      </div>
    </header>

    {{ if .Params.image }}
    <div class="border-b border-white/10 relative overflow-hidden bg-black/20">
      <div class="w-full h-auto max-h-[60vh]">
        <img
          class="w-full h-full object-cover"
          src="{{ .Params.image }}" 
          alt="{{ .Title }}">
      </div>
    </div>
    {{ end }}

    <div class="p-8 lg:p-12 prose prose-lg prose-invert max-w-none 
        font-body
        prose-headings:font-head prose-headings:text-archa-gold
        prose-a:text-archa-gold prose-a:no-underline hover:prose-a:text-white transition-colors
        prose-img:rounded-xl prose-img:border prose-img:border-white/10">
      {{ .Content }}
    </div>

    <footer class="p-8 lg:p-12 border-t border-white/10 bg-black/20 flex flex-col sm:flex-row justify-between items-center gap-6">
      <a href="/" class="btn btn-dark hover:border-archa-gold transition-colors">
        ← Späť na úvod
      </a>

      <div class="text-3xl font-black text-white/10 select-none tracking-[1em] font-head">
        ///
      </div>
    </footer>

  </article>
</div>
{{ end }}
