{{ define "main" }}
<div class="wrapper">

  <article class="card max-w-4xl mx-auto shadow-2xl bg-archa-dark">

    {{ if .Params.image }}
    <div class="w-full aspect-video md:aspect-[21/9] overflow-hidden border-b border-white/10 relative group">
      <img
        class="w-full h-full object-cover"
        src="{{ .Params.image }}" 
        alt="{{ .Title }}">
       <div class="absolute inset-0 bg-gradient-to-t from-archa-dark via-transparent to-transparent opacity-80"></div>
    </div>
    {{ end }}

    <div class="p-6 md:p-12 lg:p-16 relative">
        
        <a href="{{ .Site.BaseURL }}" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-archa-gold mb-8 transition-colors">
            <i class="ph ph-arrow-left"></i> Späť na domov
        </a>

        <header class="mb-10">
            <div class="flex flex-wrap items-center gap-3 mb-4">
                {{ with .Params.type }}
                <span class="tag bg-archa-gold text-black border-none shadow-lg shadow-archa-gold/10">
                    {{ . }}
                </span>
                {{ end }}
                <time datetime="{{ .Date.Format "2006-01-02" }}" class="text-xs font-bold uppercase tracking-widest text-gray-400 flex items-center gap-2">
                    <i class="ph ph-calendar-blank text-lg"></i>{{ .Date.Format "02. 01. 2006" }}
                </time>
            </div>

            <h1 class="text-4xl md:text-5xl lg:text-6xl font-head text-white uppercase leading-[0.9] tracking-tight mb-6 text-balance">
            {{ .Title }}
            </h1>

            {{ with .Params.author }}
            <div class="flex items-center gap-3 text-gray-400 border-l-2 border-archa-gold pl-4">
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase tracking-widest opacity-60 font-bold">Autor</span>
                    <span class="text-white font-bold">{{ . }}</span>
                </div>
            </div>
            {{ end }}
        </header>

        <div class="prose prose-lg prose-invert max-w-none 
            font-body
            prose-headings:font-head prose-headings:uppercase prose-headings:tracking-wide prose-headings:text-white
            prose-p:text-gray-300 prose-p:leading-relaxed
            prose-a:text-archa-gold prose-a:font-bold prose-a:no-underline hover:prose-a:text-white hover:prose-a:border-b hover:prose-a:border-archa-gold transition-all
            prose-strong:text-white prose-strong:font-black
            prose-blockquote:border-l-4 prose-blockquote:border-archa-gold prose-blockquote:bg-white/5 prose-blockquote:px-6 prose-blockquote:py-4 prose-blockquote:rounded-r-lg prose-blockquote:not-italic
            prose-li:marker:text-archa-gold
            prose-img:rounded-xl prose-img:border prose-img:border-white/10 prose-img:shadow-xl prose-img:w-full">
          {{ .Content }}
        </div>
    </div>

    <footer class="p-8 md:p-12 border-t border-white/10 bg-black/20 flex flex-col sm:flex-row justify-between items-center gap-6">
      <div class="text-6xl text-white/5 font-black select-none tracking-[0.5em] font-head">
        ///
      </div>
      <a href="/" class="btn btn-light text-xs">
         Všetky články
      </a>
    </footer>

  </article>
</div>
{{ end }}
