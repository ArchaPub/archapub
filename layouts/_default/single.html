{{ define "main" }}
<div class="wrapper py-10">
  
  <a href="/" class="btn btn-dark group no-underline backdrop-blur-md mb-8 inline-flex">
    <i class="ph ph-arrow-left group-hover:-translate-x-1 transition-transform"></i>
    Späť na úvod
  </a>

  <article class="card bg-archa-dark border-white/10 p-0 overflow-hidden">
    
    {{ if .Params.image }}
    <div class="w-full h-[400px] relative">
      <img src="{{ .Params.image }}" class="w-full h-full object-cover" alt="{{ .Title }}">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
      
      <div class="absolute bottom-0 left-0 p-8 w-full">
        <span class="tag bg-archa-gold text-black mb-2">{{ .Params.type | default "Event" }}</span>
        <h1 class="text-4xl md:text-6xl font-head text-white drop-shadow-lg">{{ .Title }}</h1>
        <div class="flex items-center gap-4 text-white/80 mt-2 font-semibold">
           <span><i class="ph ph-calendar mr-1"></i> {{ .Date.Format "02. 01. 2006" }}</span>
           <span><i class="ph ph-clock mr-1"></i> {{ .Date.Format "15:04" }}</span>
        </div>
      </div>
    </div>
    {{ else }}
    <div class="p-8 border-b border-white/10">
      <h1 class="text-4xl font-head text-white">{{ .Title }}</h1>
    </div>
    {{ end }}

    <div class="p-8 prose prose-invert prose-lg max-w-none prose-headings:font-head prose-a:text-archa-gold">
      {{ .Content }}
    </div>

  </article>
</div>
{{ end }}
