{{- $img := .Page.Resources.GetMatch .Destination -}}
{{- if not $img -}}
{{- $img = resources.Get .Destination -}}
{{- end -}}

{{- if $img -}}
{{- $img = $img.Resize "1200x webp q80" -}}
<img src="{{ $img.RelPermalink }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}" {{ end }} width="{{ $img.Width }}"
    height="{{ $img.Height }}" loading="lazy" />
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}" {{ end }} loading="lazy" />
{{- end -}}
