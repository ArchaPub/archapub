{{ define "main" }}
<div class="wrapper py-12 lg:py-20 px-4">

  <header class="mb-12 md:mb-16 relative border-b border-white/10 pb-8">
    <a href="/" aria-label="Späť na domovskú stránku" class="btn btn-dark mb-6 inline-flex items-center gap-2 hover:border-archa-gold transition-colors">
        <i class="ph ph-arrow-left" aria-hidden="true"></i> Späť domov
    </a>
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-head text-white uppercase leading-none">
      {{ .Title }}
    </h1>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" aria-label="Čítať viac: {{ .Title }}" class="card bg-archa-dark border-2 border-white/10 shadow-lg overflow-hidden p-0 hover:border-archa-gold group transition-all flex flex-col h-full">
      {{ if .Params.image }}
      <div class="h-64 border-b border-white/10 overflow-hidden relative bg-black/20">
        <img src="{{ .Params.image }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" alt="Obrázok k článku {{ .Title }}">
      </div>
      {{ end }}
      
      <div class="p-6 md:p-8 flex flex-col flex-1">
        <div class="flex items-center gap-3 text-xs font-bold uppercase tracking-widest text-archa-gold mb-4">
           {{ if .Date }}
           <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02. 01. 2006" }}</time>
           {{ end }}
        </div>

        <h2 class="text-2xl md:text-3xl font-head text-white leading-tight mb-4 group-hover:text-archa-gold transition-colors">
          {{ .Title }}
        </h2>
        
        <p class="text-gray-400 text-sm leading-relaxed line-clamp-3 mb-6 font-body">
          {{ .Description }}
        </p>
        
        <div class="mt-auto pt-6 border-t border-white/5 text-xs font-bold uppercase tracking-widest text-archa-gold flex items-center gap-2 group-hover:gap-3 transition-all">
          Čítať viac <i class="ph ph-arrow-right"></i>
        </div>
      </div>
    </a>
    {{ end }}
  </div>

</div>
{{ end }}
