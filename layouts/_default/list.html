{{ define "main" }}
<div class="wrapper py-20 px-4">

  <header class="mb-20">
    <a href="/" aria-label="Späť na domovskú stránku" class="inline-flex items-center gap-2 text-lg font-bold opacity-60 hover:text-archa-gold hover:opacity-100 uppercase tracking-widest mb-6 transition-colors">
        <i class="ph ph-arrow-left text-xl" aria-hidden="true"></i> Domov
    </a>
    <h1 class="text-7xl md:text-9xl font-black font-head text-white uppercase drop-shadow-2xl tracking-tight leading-none">
        {{ .Title }}
    </h1>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" aria-label="Čítať viac: {{ .Title }}" class="card bg-archa-dark border-2 border-white/20 hover:border-archa-gold hover:shadow-2xl group transition-all duration-300 flex flex-col h-full">
      {{ if .Params.image }}
      <div class="h-64 -mx-6 -mt-6 mb-8 overflow-hidden border-b-2 border-white/10 relative">
        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors z-10"></div>
        <img src="{{ .Params.image }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" alt="Obrázok k článku {{ .Title }}">
      </div>
      {{ end }}
      
      <div class="flex-1 flex flex-col">
          <h2 class="text-4xl font-head font-black text-white uppercase leading-[0.9] mb-4 group-hover:text-archa-gold transition-colors">
              {{ .Title }}
          </h2>
          <p class="text-lg text-gray-300 line-clamp-3 mb-8 font-medium leading-relaxed">
              {{ .Description }}
          </p>
          
          <div class="mt-auto pt-6 border-t border-white/10">
              <div class="text-sm font-black uppercase tracking-[0.2em] text-archa-gold flex items-center gap-3 group-hover:gap-5 transition-all" aria-hidden="true">
                Čítať viac <i class="ph ph-arrow-right text-lg"></i>
              </div>
          </div>
      </div>
    </a>
    {{ end }}
  </div>

</div>
{{ end }}
