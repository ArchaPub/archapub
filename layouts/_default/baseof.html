<!DOCTYPE html>
<html lang="sk" class="scroll-smooth">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

	{{ $styles := resources.Get "style.css" }}
	{{ $styles := $styles | minify | fingerprint | resources.PostProcess }}
	<link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">

    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
</head>

<body>
    <a href="#main-content" class="fixed left-4 -top-20 focus:top-4 transition-all duration-300 z-[100] px-6 py-3 bg-archa-gold text-archa-dark font-head font-bold rounded shadow-lg border border-black/20 focus:outline-hidden focus:ring-4 focus:ring-white/50">Prejsť na obsah</a>

    <div class="wrapper">
        {{ partial "navbar.html" . }}
    </div>

    <main id="main-content" tabindex="-1">
	    {{ block "main" . }}{{ end }}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const menuOverlay = document.getElementById('menu-overlay');
            const icon = menuBtn.querySelector('i');
            let isMenuOpen = false;

            menuBtn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                menuBtn.setAttribute('aria-expanded', isMenuOpen);
                menuOverlay.setAttribute('aria-hidden', !isMenuOpen);
                
                if (isMenuOpen) {
                    menuOverlay.classList.remove('translate-x-full');
                    icon.classList.remove('ph-list');
                    icon.classList.add('ph-x');
                } else {
                    menuOverlay.classList.add('translate-x-full');
                    icon.classList.remove('ph-x');
                    icon.classList.add('ph-list');
                }
            });
        });
    </script>
</body>

</html>
