{{ define "main" }}
<section class="min-h-screen grid lg:grid-cols-12 border-b-2 border-primary">

  <div
    class="lg:col-span-5 flex flex-col justify-center p-8 lg:p-16 bg-white border-b-2 lg:border-b-0 lg:border-r-2 border-primary">
    <div class="space-y-8 max-w-lg">
      <div
        class="inline-block bg-accent text-white px-4 py-1 text-sm font-bold uppercase tracking-widest border-2 border-primary shadow-[4px_4px_0_0_#000]">
        Interaktívna Mapa
      </div>

      <h1 class="text-display">
        Architektúra <br>
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-primary bg-[length:100%_4px] bg-no-repeat bg-bottom pb-2">Prvej
          Republiky</span>
      </h1>

      <p class="text-body text-gray-600">
        Objavte významné inovačné stavby z obdobia 1. ČSR vo vašom okolí.
      </p>

      <a href="https://www.google.com/maps/d/u/5/edit?mid=1hSR3QA6YJhS8lrJm8a-Kzc6AtWs9Jb8&usp=sharing" target="_blank"
        class="btn btn-secondary w-full sm:w-auto">
        Otvoriť vo veľkej mape →
      </a>
    </div>
  </div>

  <div class="lg:col-span-7 bg-paper p-8 lg:p-12 flex items-center justify-center">
    <div
      class="w-full h-full min-h-[500px] border-2 border-primary bg-white p-2 shadow-[8px_8px_0_0_#000] rotate-1 hover:rotate-0 transition-transform duration-300">
      <iframe class="w-full h-full border-2 border-primary grayscale hover:grayscale-0 transition-all duration-500"
        loading="lazy"
        src="https://www.google.com/maps/d/embed?mid=1hSR3QA6YJhS8lrJm8a-Kzc6AtWs9Jb8&ehbc=2E312F"></iframe>
    </div>
  </div>
</section>
{{ end }}
