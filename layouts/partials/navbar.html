<header class="flex w-full justify-between items-center py-2.5 relative z-50">
  <div class="logo">
    <a href="/" aria-label="Archa Pub Domov">
      <img src="/logo.svg" alt="{{ .Site.Title }} Logo" width="100" height="100" class="h-[100px] w-auto block transition-opacity duration-300 hover:opacity-80">
    </a>
  </div>

  <div class="flex items-center gap-4">
    <button id="menu-btn" aria-label="Otvoriť menu" aria-expanded="false" aria-controls="menu-overlay"
      class="p-2 text-white hover:text-archa-gold transition-colors z-50 cursor-pointer">
      <i class="ph ph-list text-3xl" aria-hidden="true"></i>
    </button>
  </div>

  <div id="menu-overlay" aria-hidden="true"
    class="fixed inset-0 bg-archa-dark md:bg-archa-dark/95 md:backdrop-blur-xl z-40 translate-x-full transition-transform duration-500 ease-in-out flex flex-col items-center justify-center">
    <nav aria-label="Hlavná navigácia" class="flex flex-col gap-6 text-center">
      <a href="/" class="font-head text-4xl text-white hover:text-archa-gold transition-colors">Domov</a>
      <a href="/menu" class="font-head text-4xl text-white hover:text-archa-gold transition-colors">Menu</a>
      <a href="/events" class="font-head text-4xl text-white hover:text-archa-gold transition-colors">Program</a>
      <a href="/blog" class="font-head text-4xl text-white hover:text-archa-gold transition-colors">Blog</a>
      <a href="/archive" class="font-head text-4xl text-white/50 hover:text-white transition-colors">Archív</a>
      <a href="/rezervacia" class="font-head text-4xl text-archa-gold hover:text-white transition-colors">Rezervácia</a>
    </nav>

    <div class="mt-12 pt-8 border-t border-white/10 flex gap-6">
      {{ range .Site.Data.socials.items }}
      <a href="{{ .url }}" target="_blank" aria-label="{{ .name | default .icon }}"
        class="text-2xl text-white/50 hover:text-archa-gold transition-colors duration-200">
        <i class="ph ph-{{ .icon }}-logo" aria-hidden="true"></i>
      </a>
      {{ end }}
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const menuBtn = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');
    const icon = menuBtn.querySelector('i');
    let isMenuOpen = false;

    menuBtn.addEventListener('click', () => {
      isMenuOpen = !isMenuOpen;
      menuBtn.setAttribute('aria-expanded', isMenuOpen);
      menuOverlay.setAttribute('aria-hidden', !isMenuOpen);

      if (isMenuOpen) {
        menuOverlay.classList.remove('translate-x-full');
        icon.classList.remove('ph-list');
        icon.classList.add('ph-x');
      } else {
        menuOverlay.classList.add('translate-x-full');
        icon.classList.remove('ph-x');
        icon.classList.add('ph-list');
      }
    });
  });
</script>
