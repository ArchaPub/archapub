<div class="flex flex-row items-center justify-center flex-wrap gap-4">
  {{range site.Data.social}}
  <a target="_blank" rel="noopener noreferrer"
    class="group flex items-center justify-center w-12 h-12 bg-white border-2 border-primary shadow-[4px_4px_0_0_#000] transition-all duration-200 hover:-translate-y-1 hover:-translate-x-1 hover:shadow-[6px_6px_0_0_#000] hover:bg-brand-yellow"
    href="{{.url}}">
    <img height="24" width="24" src='{{printf "/icons/%s.svg" .icon}}'
      class="w-6 h-6 transition-transform group-hover:scale-110 group-hover:rotate-6">
  </a>
  {{end}}
</div>
