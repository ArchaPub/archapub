{{ $title := .Get "title" }}
{{ $description := .Get "description" | default "" }}
{{ $content := .Inner }}

<div class="section-card hover:scale-102 transition-all">
  <h3 class="font-serif font-bold text-2xl md:text-3xl text-mnz-blue mb-4">{{ $title }}
  </h3>
  {{ if $description }}
  <p class="mb-6">
    {{ $description }}
  </p>
  {{ end }}

  {{ $content }}
</div>
