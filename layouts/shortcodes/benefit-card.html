{{ $title := .Get "title" }}
{{ $content := .Get "content" }}
{{ $rotation := .Get "rotation" | default "rotate-1" }}

<div
  class="benefit-card {{ $rotation }} transition-all hover:rotate-0 hover:scale-105 active:rotate-0 active:scale-105">
  <h3 class="font-serif font-bold text-2xl text-mnz-blue mb-4">{{ $title }}</h3>
  <p class="text-gray-800">{{ $content }}</p>
</div>
