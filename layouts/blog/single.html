{{ define "main" }}
<div class="wrapper">

    <article class="card bg-archa-dark border-white/10 p-0 overflow-hidden max-w-4xl mx-auto shadow-2xl">

        {{ if .Params.image }}
        <div class="w-full aspect-video md:aspect-[21/9] overflow-hidden border-b border-white/10 relative group">
            <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
                src="{{ .Params.image }}" alt="{{ .Title }}">
            <div class="absolute inset-0 bg-gradient-to-t from-archa-dark/60 via-transparent to-transparent"></div>
        </div>
        {{ end }}

        <div class="p-6 md:p-12 lg:p-16 relative">

            <h1
                class="text-4xl md:text-5xl lg:text-6xl font-head text-white uppercase leading-[0.9] tracking-tight mb-6 drop-shadow-lg">
                {{ .Title }}
            </h1>

            <div class="flex flex-wrap items-center gap-3 mb-8">
                <div class="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full text-sm font-semibold text-white">
                    <i class="ph ph-calendar-blank text-archa-gold text-base" aria-hidden="true"></i>
                    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02. 01. 2006" }}</time>
                </div>
                {{ if .ReadingTime }}
                <div class="flex items-center gap-2 bg-white/5 border border-white/10 px-4 py-2 rounded-full text-sm font-semibold text-white">
                    <i class="ph ph-clock text-archa-gold text-base" aria-hidden="true"></i>
                    <span>{{ .ReadingTime }} min čítania</span>
                </div>
                {{ end }}
            </div>

            <div class="prose prose-lg prose-invert max-w-none 
            font-body
            prose-headings:font-head prose-headings:uppercase prose-headings:tracking-wide prose-headings:text-white
            prose-p:text-gray-300 prose-p:leading-relaxed
            prose-a:text-archa-gold prose-a:font-bold prose-a:no-underline hover:prose-a:text-white hover:prose-a:border-b hover:prose-a:border-archa-gold transition-all
            prose-strong:text-white prose-strong:font-black
            prose-blockquote:border-l-4 prose-blockquote:border-archa-gold prose-blockquote:bg-white/5 prose-blockquote:px-6 prose-blockquote:py-4 prose-blockquote:rounded-r-lg prose-blockquote:not-italic
            prose-li:marker:text-archa-gold
            prose-img:rounded-xl prose-img:border prose-img:border-white/10 prose-img:shadow-xl">
                {{ .Content }}
            </div>
        </div>

        <footer
            class="p-6 md:p-12 border-t border-white/10 bg-black/20 flex flex-col sm:flex-row justify-between items-center gap-6">
            <a href="/blog"
                class="text-sm font-bold uppercase tracking-widest text-white/50 hover:text-archa-gold transition-colors flex items-center gap-2">
                <i class="ph ph-arrow-left"></i> Späť na blog
            </a>

            <a href="/"
                class="text-sm font-bold uppercase tracking-widest text-archa-gold hover:text-white transition-colors flex items-center gap-2">
                Domov <i class="ph ph-house"></i>
            </a>
        </footer>

    </article>
</div>
{{ end }}
